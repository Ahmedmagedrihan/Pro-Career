<html lang="en">
<head>

<style>
:root{
  --bg0:#060a13;--bg1:#0b1324;--bg2:#101c34;--card:rgba(16,26,46,.86);--card2:rgba(26,40,68,.9);
  --line:rgba(255,255,255,.09);--txt:#eaf1ff;--mut:#8ea2c6;--acc:#2ee59d;--acc2:#38a3ff;--acc3:#b57bff;
  --warn:#ffb020;--bad:#ff4d6d;--good:#34d399;--gold:#ffd166;

  --bf:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);
  --fs:16px;--ui-scale:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;width:100%;overflow:hidden;background:var(--bg0);color:var(--txt);font-family:var(--bf);font-size:var(--fs);overscroll-behavior:none;touch-action:none;position:fixed;inset:0}
body.hc{--card:rgba(0,0,0,.94);--card2:rgba(20,20,20,.97);--line:rgba(255,255,255,.4);--mut:#d6dfef}
body.lt{--fs:19px}
body.rm *{animation-duration:.001s!important;transition-duration:.001s!important}
#app{position:fixed;inset:0;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;background:radial-gradient(ellipse at 50% 30%,#12305a 0,#070b14 70%)}
#gl2d{position:absolute;inset:0;width:100%;height:100%;display:none;touch-action:none}
.layer{position:absolute;inset:0;pointer-events:none}
#ui{pointer-events:none}
#ui .screen{position:absolute;inset:0;display:none;flex-direction:column;pointer-events:auto;padding:calc(var(--sat) + 8px) calc(var(--sar) + 12px) calc(var(--sab) + 8px) calc(var(--sal) + 12px)}
#ui .screen.on{display:flex;animation:fadein .28s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.screen.glass{background:linear-gradient(180deg,rgba(6,10,19,.78),rgba(6,10,19,.9))}
.screen.half{background:linear-gradient(90deg,rgba(6,10,19,0) 0,rgba(6,10,19,0) 34%,rgba(6,10,19,.92) 52%)}
@media (max-aspect-ratio:1/1){.screen.half{background:linear-gradient(180deg,rgba(6,10,19,0) 0,rgba(6,10,19,0) 28%,rgba(6,10,19,.93) 44%)}}
.topbar{display:flex;align-items:center;gap:10px;min-height:48px;flex:0 0 auto}
.topbar h1{font-family:var(--hf);font-size:1.9rem;letter-spacing:.04em;margin:0;text-transform:uppercase;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:.8rem;color:var(--mut);font-weight:500;letter-spacing:.02em}
.content{flex:1;min-height:0;display:flex;gap:12px}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;min-height:0}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}.row{display:flex;align-items:center;gap:8px;min-width:0}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.sp{flex:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:760px){.grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.content{flex-direction:column}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card h3{margin:0 0 8px;font-family:var(--hf);font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:8px}
.card.hl{background:linear-gradient(135deg,rgba(46,229,157,.16),rgba(56,163,255,.14));border-color:rgba(46,229,157,.35)}
.btn{appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--txt);font:600 .95rem var(--bf);padding:11px 16px;border-radius:12px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:transform .08s,background .15s,border-color .15s;touch-action:manipulation}
.btn:active{transform:scale(.96)}.btn:hover{border-color:rgba(255,255,255,.28)}
.btn.primary{background:linear-gradient(135deg,#17c98a,#2ee59d);color:#04120c;border-color:transparent;font-weight:700}
.btn.blue{background:linear-gradient(135deg,#2a7be0,#38a3ff);color:#fff;border-color:transparent}
.btn.warn{background:linear-gradient(135deg,#e69a13,#ffb020);color:#201400;border-color:transparent}
.btn.bad{background:linear-gradient(135deg,#d92f52,#ff4d6d);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}.btn.sm{min-height:34px;padding:6px 11px;font-size:.82rem;border-radius:9px}.btn.lg{min-height:56px;font-size:1.1rem;padding:14px 22px}
.btn[disabled],.btn.dis{opacity:.4;pointer-events:none}
.btn.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset;color:var(--acc)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:.74rem;font-weight:600;background:rgba(255,255,255,.08);color:var(--txt);white-space:nowrap}
.pill.g{background:rgba(52,211,153,.18);color:var(--good)}.pill.b{background:rgba(56,163,255,.2);color:#8cc8ff}.pill.w{background:rgba(255,176,32,.2);color:var(--warn)}.pill.r{background:rgba(255,77,109,.2);color:#ff93a8}.pill.p{background:rgba(181,123,255,.2);color:#d3b3ff}
.mut{color:var(--mut)}.small{font-size:.8rem}.tiny{font-size:.7rem}.big{font-size:1.4rem}.huge{font-family:var(--hf);font-size:2.6rem;font-weight:700;line-height:1}.hf{font-family:var(--hf);letter-spacing:.04em;text-transform:uppercase}
.good{color:var(--good)}.bad-t{color:var(--bad)}.warn-t{color:var(--warn)}.gold{color:var(--gold)}.acc{color:var(--acc)}.center{text-align:center}.right{text-align:right}.b{font-weight:700}
.bar{height:8px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .4s}
.bar.w>i{background:linear-gradient(90deg,#e69a13,#ffd166)}.bar.r>i{background:linear-gradient(90deg,#d92f52,#ff7a93)}
.ovr{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:30px;padding:0 6px;border-radius:8px;font-family:var(--hf);font-weight:800;font-size:1.25rem;color:#06110c;background:#9aa7bd}
.ovr.e{background:linear-gradient(135deg,#7df9c8,#2ee59d)}.ovr.g{background:linear-gradient(135deg,#ffe38a,#ffc233)}.ovr.m{background:linear-gradient(135deg,#d6dbe6,#aeb8cc)}.ovr.l{background:linear-gradient(135deg,#d9a273,#b4764a)}.ovr.x{background:linear-gradient(135deg,#caa3ff,#8f5cff);color:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}.tbl th{font-family:var(--hf);font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,17,32,.98);z-index:1}
.tbl td{padding:7px 6px;text-align:right;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap}.tbl th:first-child,.tbl td:first-child,.tbl .l{text-align:left}
.tbl tr.me td{background:rgba(46,229,157,.14);font-weight:700}.tbl tr.zc td:first-child{box-shadow:inset 3px 0 0 var(--acc2)}.tbl tr.zr td:first-child{box-shadow:inset 3px 0 0 var(--bad)}.tbl tr.zp td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
.tabs{display:flex;gap:6px;overflow-x:auto;flex:0 0 auto;padding-bottom:2px;touch-action:pan-x}.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:1px solid var(--line);background:transparent;color:var(--mut);font:600 .86rem var(--bf);padding:8px 13px;border-radius:99px;white-space:nowrap;cursor:pointer;min-height:38px;touch-action:manipulation}
.tab.on{background:var(--acc);color:#04120c;border-color:var(--acc)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}.field>label{font-size:.72rem;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.in,select.in{appearance:none;width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--txt);font:500 1rem var(--bf);padding:10px 12px;border-radius:10px;min-height:44px;-webkit-user-select:text;user-select:text;touch-action:manipulation}
.in:focus{outline:2px solid var(--acc);outline-offset:0}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=range].in{-webkit-appearance:none;appearance:none;padding:0;min-height:30px;background:transparent;border:none;outline:none;touch-action:pan-y}
input[type=range].in::-webkit-slider-runnable-track{height:8px;border-radius:5px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.12)}
input[type=range].in::-moz-range-track{height:8px;border-radius:5px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.12)}
input[type=range].in::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;background:var(--acc);border:3px solid #062016;box-shadow:0 1px 6px rgba(0,0,0,.5)}
input[type=range].in::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--acc);border:3px solid #062016}
.swatches{display:flex;gap:7px;flex-wrap:wrap}.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;touch-action:manipulation}.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
.opt{display:flex;flex-wrap:wrap;gap:6px}.opt .btn{flex:0 0 auto}
.crest{width:34px;height:34px;flex:0 0 auto;border-radius:50% 50% 46% 46%/38% 38% 62% 62%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--hf);font-weight:800;font-size:.85rem;color:#fff;border:2px solid rgba(255,255,255,.75);text-shadow:0 1px 2px rgba(0,0,0,.6);position:relative;overflow:hidden}
.crest.lg{width:64px;height:64px;font-size:1.5rem;border-width:3px}.crest.sm{width:24px;height:24px;font-size:.62rem;border-width:1.5px}
.list>.item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.06);min-height:48px}
.list>.item.click{cursor:pointer}.list>.item.click:active{background:rgba(255,255,255,.06)}
.nav{display:flex;gap:6px;flex:0 0 auto;overflow-x:auto;padding:6px 0 2px;touch-action:pan-x}.nav::-webkit-scrollbar{display:none}
.nav .btn{flex:0 0 auto;flex-direction:column;gap:2px;min-width:74px;font-size:.72rem;padding:6px 8px;min-height:52px;font-weight:600}.nav .btn b{font-size:1.2rem;line-height:1}
.statrow{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:.88rem}.statrow .n{flex:0 0 32px;text-align:right;font-weight:700;font-family:var(--hf);font-size:1.1rem}.statrow .l{flex:0 0 118px;color:var(--mut);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.statrow .bar{flex:1}
.post{padding:11px 4px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;gap:10px}.post .av{width:40px;height:40px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:.9rem}.post .hd{font-size:.82rem}.post .hd b{font-size:.92rem}.post .bd{font-size:.94rem;margin:3px 0 6px;line-height:1.35}.post .ft{display:flex;gap:14px;font-size:.78rem;color:var(--mut);flex-wrap:wrap}
.node{border:1px solid var(--line);border-radius:12px;padding:9px;background:rgba(255,255,255,.04);cursor:pointer;min-height:70px;position:relative;touch-action:manipulation}.node.own{border-color:var(--acc);background:rgba(46,229,157,.12)}.node.lock{opacity:.45}.node.can{border-color:var(--acc2);box-shadow:0 0 0 1px var(--acc2) inset}.node.sel{outline:2px solid var(--gold)}
.hr{height:1px;background:var(--line);margin:6px 0;flex:0 0 auto}
.kv{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:.9rem}.kv span:first-child{color:var(--mut)}
.title-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.logo{font-family:var(--hf);font-weight:800;font-size:clamp(2.6rem,9vw,5.6rem);line-height:.9;letter-spacing:.03em;text-transform:uppercase;text-shadow:0 6px 40px rgba(46,229,157,.5)}
.logo small{display:block;font-size:.34em;letter-spacing:.5em;color:var(--acc);font-weight:600;margin-top:.5em}
/* loading / error */
#loading,#errpanel{position:absolute;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 30%,#10284a,#050810 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
#errpanel{display:none;z-index:110}
#loading .pb{width:min(420px,80vw);height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}#loading .pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .25s}
#toasts{position:absolute;left:0;right:0;top:calc(var(--sat) + 8px);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:90;pointer-events:none}
.toast{background:rgba(10,17,32,.95);border:1px solid var(--line);border-left:4px solid var(--acc);padding:9px 14px;border-radius:10px;font-size:.88rem;font-weight:600;max-width:min(560px,92vw);animation:fadein .25s ease}
.toast.warn{border-left-color:var(--warn)}.toast.bad{border-left-color:var(--bad)}.toast.blue{border-left-color:var(--acc2)}
#modal{position:absolute;inset:0;z-index:80;background:rgba(2,5,12,.7);display:none;align-items:center;justify-content:center;padding:calc(var(--sat) + 12px) calc(var(--sar) + 12px) calc(var(--sab) + 12px) calc(var(--sal) + 12px);pointer-events:auto}
#modal.on{display:flex}#modal .box{background:linear-gradient(180deg,#14213b,#0c1527);border:1px solid var(--line);border-radius:18px;padding:16px;max-width:min(640px,100%);max-height:100%;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 80px rgba(0,0,0,.6)}#modal .box.wide{max-width:min(960px,100%)}
#modal h2{margin:0;font-family:var(--hf);text-transform:uppercase;letter-spacing:.05em;font-size:1.7rem}
/* match HUD */
#hud{display:none;z-index:20}#hud.on{display:block}
#hud *{pointer-events:none}
#hud .tap,#hud .tap *{pointer-events:auto}
#sb{position:absolute;top:calc(var(--sat) + 8px);left:calc(var(--sal) + 10px);display:flex;align-items:stretch;border-radius:12px;overflow:hidden;background:rgba(6,10,19,.82);border:1px solid var(--line);font-family:var(--hf);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#sb .t{display:flex;align-items:center;gap:7px;padding:5px 11px;font-size:1.25rem;font-weight:700;letter-spacing:.05em}

#hudp{position:absolute;top:calc(var(--sat) + 60px);left:calc(var(--sal) + 10px);width:min(250px,42vw);background:rgba(6,10,19,.7);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:.78rem}
#hudp .nm{font-family:var(--hf);font-size:1.15rem;font-weight:700;letter-spacing:.05em;display:flex;align-items:center;gap:7px}#hudp .rt{margin-left:auto;font-size:1.05rem}
#radar{position:absolute;top:calc(var(--sat) + 8px);right:calc(var(--sar) + 70px);width:156px;height:104px;border-radius:10px;background:rgba(6,10,19,.55);border:1px solid var(--line)}
#pausebtn{position:absolute;top:calc(var(--sat) + 8px);right:calc(var(--sar) + 10px);width:50px;height:50px;border-radius:50%;background:rgba(6,10,19,.78);border:1px solid var(--line);color:#fff;font-size:1.3rem;display:flex;align-items:center;justify-content:center;pointer-events:auto!important}
#banner{position:absolute;left:0;right:0;top:32%;text-align:center;font-family:var(--hf);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(2.4rem,9vw,5.4rem);text-shadow:0 4px 30px rgba(0,0,0,.7);opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s;line-height:1}

<script>
(function(){
 var URLS=['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js','https://unpkg.com/three@0.128.0/build/three.min.js'];
 function $(id){return document.getElementById(id);}
 function setP(p,t){ $('lbar').style.width=(p*100)+'%'; if(t) $('ltxt').textContent=t; }
 window.__setP=setP;
 function showErr(msg){ $('loading').style.display='none'; $('errtxt').textContent=msg; $('errpanel').style.display='flex'; }
 window.__showErr=showErr;
 async function fetchText(url,onp){
  var ctl=new AbortController(); var to=setTimeout(function(){ctl.abort();},25000);
  var r=await fetch(url,{signal:ctl.signal,mode:'cors'}); if(!r.ok) throw new Error('HTTP '+r.status);
  var len=+r.headers.get('content-length')||0;
  if(!r.body||!r.body.getReader){ var t=await r.text(); clearTimeout(to); return t; }
  var rd=r.body.getReader(), chunks=[], got=0;
  for(;;){ var x=await rd.read(); if(x.done)break; chunks.push(x.value); got+=x.value.length; onp(len? got/len : Math.min(.95,got/650000)); }
  clearTimeout(to); var buf=new Uint8Array(got), o=0; for(var i=0;i<chunks.length;i++){buf.set(chunks[i],o);o+=chunks[i].length;}
  return new TextDecoder().decode(buf);
 }
 async function loadThree(){
  if(window.THREE) return; var last;
  for(var i=0;i<URLS.length;i++){
   try{
    setP(0.02,'Loading 3D engine ('+(i+1)+'/'+URLS.length+')…');
    var txt=await fetchText(URLS[i],function(p){setP(0.02+p*0.6,'Loading 3D engine… '+Math.round(p*100)+'%');});
    if(txt.indexOf('THREE')<0) throw new Error('unexpected response');
    var s=document.createElement('script'); s.text=txt; document.head.appendChild(s); if(window.THREE) return;
   }catch(e){ last=e; }
   try{
    await new Promise(function(res,rej){ var s=document.createElement('script'); s.src=URLS[i]; s.onload=res; s.onerror=function(){rej(new Error('script load failed'));}; document.head.appendChild(s); setTimeout(function(){rej(new Error('timeout'));},15000); });
    if(window.THREE) return;
   }catch(e){ last=e; }
  }
  throw new Error('Could not load the 3D engine (Three.js) from any CDN. Check your internet connection and tap Retry. '+(last?last.message:''));
 }
 async function start(){
  $('errpanel').style.display='none'; $('loading').style.display='flex'; setP(0.01,'Starting…');
  try{
   await loadThree(); setP(.66,'Preparing game code…');
   if(!window.__gameLoaded){ window.__gameLoaded=true; var s=document.createElement('script'); s.text=$('gamecode').textContent; document.body.appendChild(s); }
   else if(window.__boot){ window.__boot(); }
  }catch(e){ showErr(e.message); }
 }
 window.addEventListener('error',function(e){ if(!window.__booted) showErr('Startup error: '+(e.message||e)); });
 window.addEventListener('unhandledrejection',function(e){ if(!window.__booted) showErr('Startup error: '+((e.reason&&e.reason.message)||e.reason)); });
 $('errretry').onclick=start; start();
})();

'use strict';
/* =====================================================================
   PRO CAREER: NEXT GENERATION  —  single-file football career simulator
   Layers: core → world data → graphics → match engine → career → UI → boot
   All teams, clubs, players and sponsors are fictional / procedurally generated.

const VERSION = 1, BUILD = '1.0.0';
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

const sat01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const smooth = (a, b, v) => { const t = sat01((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > PI) d -= TAU; if (d < -PI) d += TAU; return d; };
const angLerp = (a, b, t) => a + angDiff(a, b) * t;
const sgn = v => v < 0 ? -1 : 1;
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const rpick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nowTs = () => Date.now();
const deepCopy = o => JSON.parse(JSON.stringify(o));

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
class RNG {
  constructor(seed) { this.f = mulberry32(seed >>> 0); }
  next() { return this.f(); }
  int(a, b) { return a + Math.floor(this.f() * (b - a + 1)); }

}
const CUR = '€';

  ['shortPass', 'Short Passing', 'T'], ['longPass', 'Long Passing', 'T'], ['crossing', 'Crossing', 'T'], ['finishing', 'Finishing', 'T'], ['shotPower', 'Shot Power', 'T'], ['longShots', 'Long Shots', 'T'],

/* ---------- per-tick drill simulation (replaces simStep while M.mode === 'drill') ---------- */

  const D = M.drill, b = M.ball; if (!D) return; M.sec += dt; D.t += dt;
  if (D.state === 'count') { D.cd -= dt; M.userControl = false; const n = Math.ceil(D.cd); if (n !== D.cn && n > 0 && n <= 3) { D.cn = n; showCallout(String(n)); Audio.tone(520, 520, .1, .2, 'sine'); } if (D.cd <= 0) { D.state = 'run'; D.tEl = 0; showCallout('GO!'); Audio.tone(880, 880, .2, .25, 'sine'); } dHud(D, D.def.n, 'Ready', D.id === 'tact' ? '' : 'Starting…'); }
  else if (D.state === 'run') { D.tEl += dt; M.userControl = true; if (D.def.time && D.tEl >= D.def.time && !D.over) { Drills.finish(D); } }
  const u = M.userP; const running = D.state === 'run' && !D.over;
  M.setKick && (!M.setKick.an || M.setKick.an.fired || M.setKick.out) && (M.setKick = null);
  for (const T of M.teams) if (T.players.some(p => p.dr === 'ai')) teamThink(T, dt);
  for (const p of M.players) {
    if (p.out) continue;
    if (p.user) { if (running) { if (M.phase === 'setpiece' && M.sp && M.sp.taker === p) spMove(p, dt); else userInput(p, dt); } else { p.mvx = p.mvz = 0; p.sprint = false; p.shield = false; } }
    else if (p.dr === 'ai') { if (running || D.state === 'run') aiPlayer(p, dt); else { p.mvx = p.mvz = 0; } }
    else { p.mvx = p.mvz = 0; p.sprint = false; p.lookAt = p.lookAtBall ? b : null; if (p.isGK && p.dr === 'static' && !p.an) { /* keeper stays on his line */ } }
  }
  for (const p of M.players) { if (p.out) continue; movePlayer(p, dt); animStep(p, dt); if (p.user || p.dr === 'ai') { const lx = HL - .6, lz = HW - .6; if (p.x > lx || p.x < -lx) { p.x = clamp(p.x, -lx, lx); p.vx = 0; } if (p.z > lz || p.z < -lz) { p.z = clamp(p.z, -lz, lz); p.vz = 0; } } }

  if (M.ref && M.ref.rig && M.ref.rig.root.visible) M.ref.rig.root.visible = false;
  if (D.grp && D.anim) { /* static props */ }
  if (running) { try { D.defn.run(D, dt); } catch (e) { console.error(e); if (!D.errN) { D.errN = 0; } if (++D.errN > 3) { UI.fail(e, 'drill ' + D.id); Drills.quit(); } } }

/* =====================================================================
   FREE KICK / PENALTY AIMING (FC-style): behind-the-ball camera, aim cursor, power charge,
   shot types (curl left / curl right / power / dip) and a live trajectory preview.
   The ball flight is solved with the same physics as ballStep() so the ball really goes where the cursor says.
   ===================================================================== */
const FK_TYPES = [{ id: 'curlL', n: 'CURL ◀' }, { id: 'curlR', n: 'CURL ▶' }, { id: 'power', n: 'POWER' }, { id: 'dip', n: 'DIP' }];
function fkInRange(sp) { return Math.hypot(sp.x - sp.team.dir * HL, sp.z) < 36; }
function fkActive() {
  const sp = M.sp; if (!sp || M.phase !== 'setpiece' || !sp.taker || !sp.taker.user || sp.auto || !M.userControl) return false;
  return sp.type === 'penalty' || (sp.type === 'freekick' && fkInRange(sp));
}
function fkTypeId(sp) { return sp.fk ? FK_TYPES[sp.fk.ti].id : 'power'; }
function fkTypeName() { const sp = M.sp; return sp && sp.fk ? FK_TYPES[sp.fk.ti].n : 'TYPE'; }

/* mirror of ballStep(): returns where the ball crosses the goal plane (or where it lands) */
function predictFlight(x0, y0, z0, vx, vy, vz, spin, gx, tmax, pts) {
  const dt = 1 / 60; let x = x0, y = y0, z = z0, t = 0, n = 0;
  while (t < tmax) {

const ACT = {}, INP = {}, SCR = {};
const UI = {
  cur: null, params: null, stack: [], root: null, ready: false, st: { setTab: 'game', saveMsg: '' }, errs: [],
  init() {

    });

    root.innerHTML = '<div class="screen on ' + (r.cls || 'glass') + (keep ? ' nf' : '') + '" id="scr_' + this.cur + '">' + r.html + '</div>';

    const key = (club ? 'c' + club.id : 'def') + (tod || 'dusk'); if (key === this.themeKey) return; this.themeKey = key;
    GFX.clearRigs && 0; GFX.setStadiumTheme(club ? club.c1 : '#2a4a9a', club ? club.c2 : '#e8e8e8', .85, hashStr(club ? club.name : 'menu')); GFX.setWeather('sunny', tod || 'dusk');
  },
  menuKit(club) { return club ? kitDef(club, false) : { shirt: '#2a7be0', trim: '#ffffff', pat: 'solid', shorts: '#14213d', socks: '#2a7be0', sockTrim: '#ffffff', num: '#ffffff', glove: '#f2f2f2' }; },
  setMode(mode, o) {
    o = o || {}; if (!GFX.ready) { this.mode = mode; return; }
    const sw = mode !== this.mode; if (sw) { this.clear(); this.mode = mode; this.t = 0; if (mode === 'rig' && !o.keepYaw) { this.yaw = this.yawT = .35; } }
    this.minDt = o.cap ? 1 / o.cap : (mode === 'rig' ? 1 / 40 : 1 / 30);
    const club = o.club !== undefined ? o.club : (G ? UC() : null);
    if (mode === 'orbit') { this.theme(club, o.tod || 'dusk'); if (!this.jog.length) this.buildJog(club); this.off = { x: 0, y: 0 }; }
    else if (mode === 'rig') { this.theme(club, o.tod || 'dusk'); this.off = o.off || { x: .17, y: 0 }; this.setRig(o.look, o.kit || this.menuKit(club), o.num, o.gk); }
  },
  buildJog(club) {
    const kit = this.menuKit(club); const rng = new RNG(hashStr('jog' + (club ? club.id : 0)));
    for (let i = 0; i < 9; i++) {
      const look = Object.assign({}, lookFor({ id: 500 + i * 13, nat: rng.pick(['ENG', 'ESP', 'BRA', 'FRA', 'GER']), ht: 176 + rng.int(0, 10), pos: 'CM' })); look.kit = i === 8 ? gkKit([kit.shirt]) : kit; look.number = i === 8 ? 1 : 2 + i; look.gk = i === 8;
      let R; try { R = GFX.buildRig(look); } catch (e) { continue; } this.jog.push({ R, a0: rng.range(0, TAU), r: 9 + (i % 4) * 5, dir: i % 2 ? 1 : -1, spd: rng.range(3, 4.6), ph: rng.next(), x: 0, z: 0, yaw: 0 });
    }
  },
  setRig(look, kit, num, gk) {
    if (!look) return; const full = Object.assign({}, look, { kit, number: num != null ? num : (look.number != null ? look.number : 9), gk: !!gk });
    const key = JSON.stringify([full, kit]); if (key === this.rigKey && this.rig) return; this.rigKey = key; if (this.rig) { GFX.removeRig(this.rig); this.rig = null; }
    try { this.rig = GFX.buildRig(full); } catch (e) { console.error(e); }
  },
  attachDrag(el) {
    let id = null, lx = 0; const move = e => { if (e.pointerId !== id) return; const dx = e.clientX - lx; lx = e.clientX; this.yawT += dx * .012; this.yaw = this.yawT; };
    el.addEventListener('pointerdown', e => { id = e.pointerId; lx = e.clientX; try { el.setPointerCapture(id); } catch (_) { } e.preventDefault(); });
    el.addEventListener('pointermove', move); const end = e => { if (e.pointerId === id) id = null; }; el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  },
  frame(rdt) {
    if (!GFX.ready || GFX.lost || this.mode === 'none' || Match.active || (typeof Drills !== 'undefined' && Drills.active)) return;
    this.acc += rdt; if (this.acc < this.minDt) return; const dt = Math.min(this.acc, .1); this.acc = 0; this.t += dt; const cam = GFX.camera, w = GFX.w, h = GFX.h;
    GFX.setBall({ x: 0, y: BALL_R, z: 0 }); let fov = 50;
    if (this.mode === 'orbit') {
      const a = this.t * .07 + .6; cam.position.set(Math.cos(a) * 66, 17 + Math.sin(this.t * .11) * 3.5, Math.sin(a) * 44); cam.lookAt(0, 1.5, 0);
      for (const j of this.jog) { const w2 = j.spd / j.r; const ang = j.a0 + this.t * w2 * j.dir; const nx = Math.cos(ang) * j.r, nz = Math.sin(ang) * j.r * .72; const vx = nx - j.x, vz = nz - j.z; if (j.x || j.z) { j.yaw = Math.atan2(vx, vz); } j.x = nx; j.z = nz; j.ph += j.spd * dt / strideLenFor(j.spd); GFX.posePlayer(j.R, { x: nx, y: 0, z: nz, yaw: j.yaw, vf: j.spd, vl: 0, ph: j.ph, fat: 0, an: null, look: { x: nx + vx * 5, z: nz + vz * 5 } }, dt); }
    } else if (this.mode === 'rig') {
      fov = 30; this.yaw = lerp(this.yaw, this.yawT, .35); cam.position.set(0, 1.12, 5.5); cam.lookAt(0, .93, 0); GFX.setBall({ x: .55, y: BALL_R, z: .55 });
      if (this.rig) GFX.posePlayer(this.rig, { x: 0, y: 0, z: 0, yaw: this.yaw, vf: 0, vl: 0, ph: 0, fat: 0, an: null, look: { x: 0, z: 5 }, idleT: this.t }, dt);
    }
    if (Math.abs(cam.fov - fov) > .05) { cam.fov = fov; cam.updateProjectionMatrix(); }
    // shift the subject towards the clear side of the screen
    const portrait = w < h; const tx = this.off.x && !portrait ? this.off.x : 0, ty = (this.off.x || this.off.y) && portrait ? (this.off.y || this.off.x * 1.05) : this.off.y && !portrait ? this.off.y : 0;
    this.curOff.x = lerp(this.curOff.x, tx, .18); this.curOff.y = lerp(this.curOff.y, ty, .18);
    if (Math.abs(this.curOff.x) > .001 || Math.abs(this.curOff.y) > .001) cam.setViewOffset(w, h, this.curOff.x * w, this.curOff.y * h, w, h); else if (cam.view && cam.view.enabled) cam.clearViewOffset();
    GFX.sun.target.position.set(0, 0, 0); GFX.sun.position.set(34, 62, 22); GFX.sun.target.updateMatrixWorld();
    GFX.uTime.value += dt; GFX.updateNets(dt); GFX.renderer.render(GFX.scene, GFX.camera);
  }
};

/* ---------------- shared flow helpers ---------------- */
const App = {
  confirmLeave: false,
  hasCareer() { return !!G; },
  latestSlot() { const m = SaveSys.meta(); let best = null; for (const k in m) { if (!m[k] || !m[k].t) continue; if (!best || m[k].t > best.t) best = { slot: +k, t: m[k].t }; } return best; },
  loadSlot(slot) {
    const r = SaveSys.read(slot);
    if (!r.ok) {
      if (r.err === 'corrupt') { Modal.show('<h2>Save damaged</h2><div class="scroll" style="line-height:1.5">This save could not be read, and no usable backup was found. Nothing has been deleted. You can download the raw data to keep it safe.</div><div class="row" style="justify-content:flex-end"><button class="btn" data-mc="raw">Download raw data</button><button class="btn primary" data-mc="ok">OK</button></div>', { handler: id => { if (id === 'raw' && r.raw) downloadText('procareer-slot' + slot + '-raw.txt', r.raw); else Modal.close(); } }); } else toast('That slot is empty', 'warn');
      return false;
    }
    try { loadCareerData(r.data); } catch (e) { Modal.alert('Could not load career', '<div>' + esc(e.message) + '</div><div class="mut small" style="margin-top:6px">Your save has not been changed.</div>'); return false; }
    G.slot = slot === 0 ? (r.data.slot > 0 ? r.data.slot : 1) : slot; if (r.recovered) toast('Loaded from the automatic backup of this slot', 'warn', 4500);
    Flow.reset(); UI.go('hub', null, { reset: true }); return true;
  },
  saveTo(slot) { if (!G) return; const r = saveCareer(slot, false); if (r.ok) toast('Career saved to slot ' + slot, '', 2200); else Modal.alert('Save failed', esc(r.err)); return r.ok; }
};

/* =====================================================================
   UI LAYER (4/4 a): flow controller — advance, match prep, post-match, cards, week & season recaps, career end
   ===================================================================== */
const Flow = {
  pend: null, busy: false,
  reset() { this.pend = null; this.busy = false; },
  advance() {
    if (this.busy || !G) return; if (G.over) { UI.go('end', null, { reset: true }); return; }
    let a; try { a = nextStep(); } catch (e) { UI.fail(e, 'nextStep'); console.error(e); Modal.alert('Something went wrong advancing the week', esc(e.message) + '<div class="mut small" style="margin-top:6px">Your last autosave is intact. You can export it from Load / Save.</div>'); UI.go('hub', null, { reset: true }); return; }
    this.handle(a);
  },
  handle(a) {
    if (!a) { UI.go('hub', null, { reset: true }); return; }
    switch (a.k) {
      case 'match': this.pend = { f: a.f, sel: a.sel, reserve: !!a.reserve, spec: null }; UI.go('prep', null, { reset: true }); break;
      case 'card': this.showCard(a); break;
      case 'result': UI.go('post', { why: a.why, auto: true }, { reset: true }); break;
      case 'trophy': this.showTrophy(a); break;
      case 'week': UI.go('week', { rep: a.rep }, { reset: true }); break;
      case 'season': UI.go('season', { sum: a.sum, rep: a.rep }, { reset: true }); break;
      default: this.advance();
    }
  },
  showCard(a) {
    const info = cardInfo(a);
    const html = '<h2>' + esc(info.title) + '</h2><div class="scroll" style="line-height:1.45;max-height:48vh">' + info.body + '</div><div class="col" style="gap:8px">' + info.choices.map(c => '<button class="btn" data-mc="' + c.id + '" style="flex-direction:column;gap:2px"><span><b>' + esc(c.l) + '</b></span>' + (c.d ? '<span class="small mut" style="font-weight:500">' + esc(c.d) + '</span>' : '') + '</button>').join('') + '</div>';
    Modal.show(html, {
      handler: id => {
        let r; try { r = resolveCard(a, id); } catch (e) { Modal.close(); UI.fail(e, 'card'); Flow.advance(); return; }
        if (typeof r === 'string' && r) Modal.show('<h2>' + esc(info.title) + '</h2><div style="line-height:1.45">' + esc(r) + '</div><div class="row" style="justify-content:flex-end"><button class="btn primary" data-mc="ok">Continue</button></div>', { handler: () => { Modal.close(); Flow.afterCard(null); } });
        else { Modal.close(); Flow.afterCard(r); }
      }
    });
  },
  afterCard(r) {
    if (r && r.retire) { UI.go('end', null, { reset: true }); return; }
    if (r && r.go) { UI.go('hub', null, { reset: true }); UI.go(r.go); return; } this.advance();
  },
  showTrophy(a) {
    Audio.good(); Modal.show('<div class="center"><div class="trophy">&#127942;</div><h2>' + esc(a.name) + '</h2><div style="line-height:1.4">Silverware! You are a champion.</div></div><div class="row" style="justify-content:center"><button class="btn primary lg" data-mc="ok">Lift the trophy</button></div>', { handler: () => { Modal.close(); Flow.advance(); } });
  },
  /* ---- match execution ---- */
  spec() { const pe = this.pend; if (!pe.spec) pe.spec = buildMatchSpec(pe.f, pe.sel); return pe.spec; },
  play() {
    const pe = this.pend; if (!pe || this.busy) return; if (!GFX.ready || GFX.lost) { toast('3D view unavailable — simulating instead', 'warn'); this.sim(); return; }
    this.busy = true; let spec; try { spec = this.spec(); } catch (e) { this.busy = false; UI.fail(e, 'spec'); return; }
    Stage.release(); autosave();
    try { Match.start(spec, res => { this.busy = false; this.afterMatch(res); }); } catch (e) { this.busy = false; Match.active = false; M.active = false; $('ui').style.display = ''; document.body.classList.remove('inmatch'); Input.show(false); UI.fail(e, 'matchStart'); Modal.alert('Could not start the 3D match', esc(e.message) + '<div class="mut small">Try "Simulate with engine" instead.</div>'); }
  },
  sim() {
    const pe = this.pend; if (!pe || this.busy) return; this.busy = true; let spec; try { spec = this.spec(); } catch (e) { this.busy = false; UI.fail(e, 'spec'); return; }
    Modal.show('<h2>Simulating match&hellip;</h2><div class="center"><div class="big-pct" id="simpct">0%</div><div class="bar" style="margin:10px 0"><i id="simbar" style="width:0"></i></div><div class="huge" id="simsc">0 - 0</div><div class="small mut" id="simclk">00:00</div></div>', { handler: () => { } });
    M.onBanner = M.onCallout = M.onGoal = M.onShot = M.onSendOff = M.onSub = M.onUserSubbed = M.onSwitch = M.onPhase = null;
    setTimeout(() => {
      try {
        runHeadless(spec, (pct, score, clk) => { const a = $('simpct'); if (a) { a.textContent = Math.round(pct * 100) + '%'; $('simbar').style.width = Math.round(pct * 100) + '%'; $('simsc').textContent = score[0] + ' - ' + score[1]; $('simclk').textContent = clk || ''; } }, res => { Modal.close(); this.busy = false; this.afterMatch(res); });
      } catch (e) { Modal.close(); this.busy = false; UI.fail(e, 'sim'); }
    }, 60);
  },
  quick() {
    const pe = this.pend; if (!pe || this.busy) return; let res; try { res = statSimLine(pe.f, pe.reserve ? { k: 'start' } : pe.sel); } catch (e) { UI.fail(e, 'quick'); return; } this.afterMatch(res);
  },
  afterMatch(res) {
    const pe = this.pend; this.pend = null;
    try { if (pe.reserve) finishReserve(pe.f, res); else finishUserMatch(pe.f, res); } catch (e) { UI.fail(e, 'finishMatch'); console.error(e); }
    UI.go('post', null, { reset: true });
  }
};
ACT.advance = () => Flow.advance();

/* ---------------- Finances ---------------- */
SCR.finances = function () {

  const life = LIFE.map(L => { const cur = u.life[L.id]; const nx = L.lv[cur + 1]; return '<div class="card"><div class="row"><div class="grow"><b>' + L.n + '</b><div class="tiny mut">' + L.d + '</div></div><span class="pill ' + (cur ? 'g' : '') + '">' + esc(L.lv[cur][0]) + '</span></div><div class="row wrap" style="margin-top:6px"><span class="small mut">' + (cur ? fmtM(L.lv[cur][1]) + '/wk' : 'Free') + '</span><div class="sp"></div>' + (cur > 0 ? H.btn('Downgrade', 'lfSet', L.id + ':' + (cur - 1), 'sm') : '') + (nx ? H.btn('Upgrade &middot; ' + esc(nx[0]) + ' (' + fmtM(nx[1]) + '/wk)', 'lfSet', L.id + ':' + (cur + 1), 'sm primary') : '') + '</div></div>'; }).join('');

};

/* ---------------- International ---------------- */
SCR.intl = function () {
  const W = G.W, p = UP(), u = p.u; const n = NAT[p.nat]; const id = nid(p.nat); const I = W.intl;
  const nats = NATIONS.map(x => [x, natStr(W, x.c).ovr]).sort((a, b) => b[1] - a[1]); const rk = nats.findIndex(x => x[0].c === p.nat) + 1; const rankInNat = natRank(W, p);
  const fx = W.fixtures.filter(f => isNat(f.h) && (f.h === id || f.a === id) && !fixDone(f)).sort((a, b) => a.w - b.w || a.s - b.s).slice(0, 6);
  const sq = squadForNation(p.nat, true).sort((a, b) => b.o - a.o);
  const q = I && I.qualComp, t = I && I.tourComp; const gq = q && q.groups.find(g => g.teams.includes(id)); const gt = t && t.groups.find(g => g.teams.includes(id));
  const html = H.top(esc(n.n), 'International', '') + '<div class="content" style="margin-top:6px"><div class="col scroll"><div class="card hl"><div class="row">' + H.crest(id, 'lg') + '<div class="grow"><div class="hf big">' + esc(n.n) + '</div><div class="small mut">World ranking #' + rk + ' of ' + NATIONS.length + ' &middot; strength ' + Math.round(nats[rk - 1][1]) + '</div></div></div><div class="hr"></div>' + H.kv('Your caps', u.intl.caps) + H.kv('International goals', u.intl.goals) + H.kv('Status', u.intl.called ? '<b class="good">Called up before</b>' : 'Not yet called up') + H.kv('Rank among ' + esc(n.n) + ' players', '#' + rankInNat) + '<div class="tiny mut" style="margin-top:6px">Call-ups depend on your rating relative to your compatriots and your reputation. Fixtures happen in international breaks (weeks ' + CAL.breaks.join(', ') + ') and the summer tournament.</div></div><div class="card"><h3>Next internationals</h3>' + (fx.length ? fx.map(f => '<div class="row small" style="padding:4px 0">' + H.crest(weekOpp2(f, id), 'sm') + '<span class="grow"><b>' + (f.h === id ? 'vs ' : 'at ') + esc(nameOf(W, f.h === id ? f.a : f.h)) + '</b><br><span class="tiny mut">' + esc(compName(W, f)) + ' &middot; week ' + f.w + (G.callup[f.w] ? ' &middot; <b class="good">you are in the squad</b>' : '') + '</span></span></div>').join('') : H.empty('No fixtures scheduled.')) + '</div>' + (gq ? groupTableHTML(q, gq, q.groups.indexOf(gq), x => x === id) : '') + (gt ? groupTableHTML(t, gt, t.groups.indexOf(gt), x => x === id) : '') + '</div><div class="col scroll"><div class="card" style="padding:6px"><h3 style="padding:6px 6px 0">Squad</h3><table class="tbl"><thead><tr><th class="l">Player</th><th>Pos</th><th>Age</th><th>OVR</th></tr></thead><tbody>' + sq.map(x => '<tr class="' + (x.id === G.pid ? 'me' : '') + '" data-a="playerInfo" data-v="' + x.id + '" style="cursor:pointer"><td class="l">' + esc(shortName(x)) + '</td><td>' + x.pos + '</td><td>' + x.age + '</td><td>' + H.ovr(x.o) + '</td></tr>').join('') + '</tbody></table></div></div></div>';
  return { html, cls: 'glass', stage: 'orbit', stageOpts: { cap: 20 } };
};
function weekOpp2(f, id) { return f.h === id ? f.a : f.h; }

/* ---------------- Trophies & achievements ---------------- */
SCR.trophies = function () {
  const W = G.W, p = UP(), u = p.u; const c = u.career; const peak = Math.max(p.o, ...u.seasons.map(s => s.ovr || 0));
  const ach = [['First appearance', c.apps >= 1], ['First goal', c.g >= 1], ['10 career goals', c.g >= 10], ['50 career goals', c.g >= 50], ['100 career goals', c.g >= 100], ['First assist', c.a >= 1], ['50 appearances', c.apps >= 50], ['200 appearances', c.apps >= 200], ['A hat-trick', c.hat >= 1], ['Man of the match', c.mom >= 1], ['First international cap', u.intl.caps >= 1], ['International goal', u.intl.goals >= 1], ['First trophy', u.trophies.length >= 1], ['Club captain', !!u.captain || G.log.some(l => /captain/.test(l.x))], ['Reach 70 OVR', peak >= 70], ['Reach 80 OVR', peak >= 80], ['Reach 90 OVR', peak >= 90], ['Season award', u.awards.length >= 1], ['Sign a sponsorship', u.sponsors.length > 0 || G.log.some(l => /Signed with/.test(l.x))], ['Reach level 20', u.lvl >= 20]];
  const html = H.top('Trophies', '', '') + '<div class="content" style="margin-top:6px"><div class="col scroll"><div class="card"><h3>Trophy cabinet <span class="pill g">' + u.trophies.length + '</span></h3>' + (u.trophies.length ? '<div class="grid3">' + u.trophies.map(t => '<div class="card center" style="padding:10px"><div class="trophy">&#127942;</div><b class="small">' + esc(t.name) + '</b><div class="tiny mut">' + seasonLabelFor(t.s) + (t.club != null && t.club >= 0 && W.clubs[t.club] ? ' &middot; ' + esc(W.clubs[t.club].ab) : t.nat ? ' &middot; ' + t.nat : '') + '</div></div>').join('') + '</div>' : H.empty('The cabinet is empty &mdash; for now.')) + '</div><div class="card"><h3>Individual awards <span class="pill g">' + u.awards.length + '</span></h3>' + (u.awards.length ? u.awards.map(a => '<div class="row small" style="padding:3px 0">&#127941; <span class="grow">' + esc(a.k) + '</span><span class="mut">' + seasonLabelFor(a.s) + '</span></div>').join('') : H.empty('None yet.')) + '</div></div><div class="col scroll"><div class="card"><h3>Achievements <span class="pill">' + ach.filter(a => a[1]).length + '/' + ach.length + '</span></h3>' + ach.map(a => '<div class="row small" style="padding:4px 0;opacity:' + (a[1] ? 1 : .45) + '">' + (a[1] ? '&#9989;' : '&#9898;') + ' <span class="grow">' + a[0] + '</span></div>').join('') + '</div></div></div>';
  return { html, cls: 'glass', stage: 'orbit', stageOpts: { cap: 20 } };
};

SCR.history = function () {
  const W = G.W, p = UP(), u = p.u; const tab = UI.st.hiTab || 'time'; let body = '';
  if (tab === 'time') body = '<div class="card list">' + (G.log.slice().reverse().slice(0, 150).map(l => '<div class="item"><span class="tiny mut" style="width:74px">' + seasonLabelFor(l.s) + ' W' + l.w + '</span><span class="grow small">' + esc(l.x) + '</span></div>').join('') || H.empty('Your story starts now.')) + '</div>';

  const html = H.top('History', '', '') + H.tabs([['time', 'Timeline'], ['clubs', 'Moves'], ['seasons', 'Seasons']], tab, 'hiTab') + '<div class="content" style="margin-top:6px"><div class="col scroll">' + body + '</div></div>';
  return { html, cls: 'glass', stage: 'orbit', stageOpts: { cap: 20 } };

ACT.hiTab = v => { UI.st.hiTab = v; UI.refresh(); };

/* =====================================================================
   BOOT: main loop, resize, visibility, input guards, error handling
   ===================================================================== */
const Boot = { last: 0, booted: false, loopOn: false, glOk: false, glErr: '', menusOnly: false, frameErrs: 0, errToast: 0, lostPause: false, hiddenPause: false, started: false };
const Fallback2D = { on: false, resize() { } };
const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
const setProg = (p, t) => { try { window.__setP && window.__setP(p, t); } catch (e) { } };

function mainLoop(ts) {
  requestAnimationFrame(mainLoop);
  const rdt = Math.min(.25, Math.max(0, (ts - Boot.last) / 1000) || .016); Boot.last = ts;
  if (document.hidden) return;
  try {
    if (GFX.ready && GFX.lost) {
      if (Match.active && !M.paused && !M.finished && !M.fast) { M.paused = true; Boot.lostPause = true; }
      return;
    }
    if (Boot.lostPause && GFX.ready && !GFX.lost) { Boot.lostPause = false; if (Match.active && M.paused && !Modal.open) { M.paused = false; Match.pauseMenu(); } }
    if (Match.active) matchFrame(rdt);
    else if (typeof Drills !== 'undefined' && Drills.active) Drills.frame(rdt);
    else Stage.frame(rdt);
    Boot.frameErrs = 0;
  } catch (e) { Boot.frameError(e); }
}
Boot.frameError = function (e) {
  Boot.frameErrs++; console.error('[frame]', e); UI.errs.push({ t: nowTs(), ctx: 'frame', msg: String(e && e.message || e), stack: String(e && e.stack || '').slice(0, 600) }); if (UI.errs.length > 20) UI.errs.shift();
  const now = performance.now();
  if (Boot.frameErrs === 3 || (Boot.frameErrs > 3 && now - Boot.errToast > 6000)) {
    Boot.errToast = now; toast('Graphics error: ' + String(e && e.message || e).slice(0, 90), 'bad', 5000);
    if (Match.active && !M.paused && !Modal.open && !M.finished) { try { Match.pauseMenu(); } catch (e2) { } }
  }
  if (Boot.frameErrs > 240 && !Match.active) { Stage.mode = 'none'; }
};

function onResize() {
  try { if (GFX.ready) GFX.resize(); if (typeof Input !== 'undefined' && Input.built) Input.relayout(); if (typeof Fallback2D !== 'undefined' && Fallback2D.on) Fallback2D.resize(); } catch (e) { console.error(e); }
}
function onVisibility() {
  if (document.hidden) {
    Audio.suspend(); if (Match.active && !M.paused && !M.finished && !M.fast && !Modal.open) { try { Match.pauseMenu(); Boot.hiddenPause = true; } catch (e) { } }
    if (Match.active && typeof Input !== 'undefined') Input.reset();
  } else { Boot.last = performance.now(); Audio.resume(); onResize(); Boot.hiddenPause = false; }
}

function installGuards() {
  const allowScroll = t => !!(t && t.closest && t.closest('.scroll, .modal .scroll, textarea, input[type=range], select, [data-allowscroll]'));
  document.addEventListener('touchmove', e => { if (!allowScroll(e.target)) e.preventDefault(); }, { passive: false });
  document.addEventListener('touchstart', e => { if (e.touches && e.touches.length > 1 && !allowScroll(e.target)) e.preventDefault(); }, { passive: false });
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
  document.addEventListener('contextmenu', e => { if (!(e.target && e.target.closest && e.target.closest('textarea,input[type=text]'))) e.preventDefault(); });
  document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', e => { if (!(e.target && e.target.closest && e.target.closest('textarea,input'))) e.preventDefault(); }, { passive: false });
  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault(); });
  window.addEventListener('resize', onResize); window.addEventListener('orientationchange', () => { setTimeout(onResize, 120); setTimeout(onResize, 450); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
  document.addEventListener('visibilitychange', onVisibility); window.addEventListener('pagehide', () => { try { if (G && !G.over && G.slot != null && !Match.active) autosave(); } catch (e) { } });
  window.addEventListener('blur', () => { if (Match.active && typeof Input !== 'undefined') Input.reset(); });
  // global audio unlock + menu music
  const unlock = () => { Audio.unlock(); if (!Match.active && !Audio.musicOn && !Settings.muted && Settings.vMusic > 0) Audio.startMusic(); };
  document.addEventListener('pointerdown', unlock, { passive: true });
  window.addEventListener('error', e => { if (!Boot.booted) return; console.error('[error]', e.error || e.message); const now = performance.now(); if (now - Boot.errToast > 4000) { Boot.errToast = now; UI.errs.push({ t: nowTs(), ctx: 'window', msg: String(e.message || e).slice(0, 200) }); toast('Unexpected error: ' + String(e.message || e).slice(0, 100), 'bad', 4000); } });
  window.addEventListener('unhandledrejection', e => { if (!Boot.booted) return; console.error('[reject]', e.reason); const now = performance.now(); if (now - Boot.errToast > 4000) { Boot.errToast = now; UI.errs.push({ t: nowTs(), ctx: 'promise', msg: String(e.reason && e.reason.message || e.reason).slice(0, 200) }); toast('Unexpected error: ' + String(e.reason && e.reason.message || e.reason).slice(0, 100), 'bad', 4000); } });
}

async function boot() {
  if (Boot.started && Boot.booted) { try { UI.go(G ? 'hub' : 'title', null, { reset: true }); $('loading').style.display = 'none'; } catch (e) { } return; }
  Boot.started = true;
  try {
    setProg(.7, 'Loading settings…'); await nextFrame();
    loadSettings(); if (!Store.test()) setTimeout(() => toast('Browser storage is unavailable — progress cannot be saved on this device. Use Export to keep your career.', 'warn', 8000), 1200);
    setProg(.76, 'Starting 3D renderer…'); await nextFrame();
    Boot.glOk = false; Boot.glErr = '';
    if (!GFX.ready) { try { GFX.init(); Boot.glOk = true; } catch (e) { Boot.glErr = String(e && e.message || e); console.error(e); } } else Boot.glOk = true;
    setProg(.92, 'Building menus…'); await nextFrame();
    UI.init(); installGuards(); Boot.booted = true; window.__booted = true;
    if (!Boot.glOk) {
      $('loading').style.display = 'none'; const ep = $('errpanel'); $('errtxt').textContent = 'The 3D view could not start: ' + Boot.glErr + ' You can still play the career in menus-only mode — matches are then simulated by the same engine (full stats, no 3D).';
      const bm = $('errmenu'); bm.style.display = ''; bm.onclick = () => { ep.style.display = 'none'; Boot.menusOnly = true; UI.go('title', null, { reset: true }); toast('Menus-only mode: matches are simulated', 'warn', 4000); }; ep.style.display = 'flex';
    } else {
      setProg(1, 'Ready'); UI.go('title', null, { reset: true });
      const ld = $('loading'); ld.style.transition = 'opacity .35s'; ld.style.opacity = '0'; setTimeout(() => { ld.style.display = 'none'; ld.style.opacity = ''; }, 380);
    }
    if (!Boot.loopOn) { Boot.loopOn = true; Boot.last = performance.now(); requestAnimationFrame(mainLoop); }
  } catch (e) {
    console.error(e); Boot.started = false; if (window.__showErr) window.__showErr('Startup error: ' + String(e && e.message || e));
  }
}
window.__booted = false; window.__boot = boot; boot();
